name: Release

# Push a tag like v0.1.0 (or v0.2.0-rc1 for a pre-release) to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          case "$TAG" in
            "v$ver"|"v$ver"-*) ;;
            *) echo "::error::tag $TAG does not match Cargo.toml version $ver"; exit 1 ;;
          esac

      # Both builds run in the XCP-ng 8.3 build container, so the binaries
      # only need glibc 2.17 and run on XCP-ng 8.3 as well as on any modern
      # distribution. The scripts fail if a binary needs a newer glibc.
      - name: Build patched libxenstat (XCP-ng 8.3)
        env:
          CONTAINER_ENGINE: docker
        run: build/build-libxenstat.sh

      - name: Build xentop-ng
        env:
          CONTAINER_ENGINE: docker
        run: build/build-xentop-ng.sh

      # arm64 and riscv64, cross-built with zig against old glibcs; the
      # script runs the test suite and the demo under qemu-user.
      - name: Build xentop-ng for arm64 and riscv64
        env:
          CONTAINER_ENGINE: docker
        run: build/build-cross.sh

      - name: Smoke test
        run: |
          build/out/xentop-ng --version
          build/out/xentop-ng --demo --batch -n 1 -d 0.2 | python3 -m json.tool > /dev/null

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: dist/package.sh "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/out/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      # Only for the CHANGELOG entry that goes into the release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      # Attestations need a public repository (or GitHub Enterprise Cloud).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # This version's CHANGELOG section ("## [0.3.1] - ..." up to the
          # next "## ["), without its heading; none for pre-releases.
          ver="${TAG#v}"
          awk -v h="## [$ver]" '/^## \[/ { p = (index($0, h) == 1); next } p' CHANGELOG.md > changes.md
          if grep -q '[^[:space:]]' changes.md; then
            { echo "## What's new"; cat changes.md; echo; } > notes.md
          else
            : > notes.md
          fi
          cat >> notes.md <<EOF
          ## Downloads

          - **xentop-ng-$TAG-xcp-ng-8.3.tar.gz**: for XCP-ng 8.3. Includes the
            patched libxenstat (used only through the \`xtop\` launcher) and an
            installer: \`tar xzf … && cd xentop-ng-$TAG-xcp-ng-8.3 && ./install.sh\`,
            then run \`/opt/xentop-ng/bin/xtop\`.
          - **xentop-ng-$TAG-x86_64-linux-gnu.tar.gz**: the binary alone, for
            any x86_64 Linux dom0 with glibc 2.17 or newer. It uses the system
            libxenstat and fills gaps with built-in fallbacks.
          - **xentop-ng-$TAG-aarch64-linux-gnu.tar.gz** and
            **xentop-ng-$TAG-riscv64-linux-gnu.tar.gz**: the same for arm64
            (glibc 2.17 or newer) and riscv64 (glibc 2.27 or newer) dom0s.
            Tested under qemu-user only so far; reports from real hosts welcome.

          Verify: \`sha256sum -c SHA256SUMS\` and
          \`gh attestation verify <file> --repo $REPO\`.
          EOF
          gh release create "$TAG" release/* --repo "$REPO" --title "xentop-ng $TAG" \
            --notes-file notes.md --verify-tag $pre
